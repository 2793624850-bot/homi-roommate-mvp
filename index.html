function renderLifeBar(){let w=weatherText(),c=state.homeConfig,l=state.homeLive;let tiles=[];if(c.washer)tiles.push(`<div class='status-tile clickable' onclick="cycleDevice('washer')"><span>🫧 洗衣机</span><b><i class='status-dot ${l.washer==='running'?'busy':''}'></i>${l.washer==='running'?'使用中 · 还剩 28 分':'空闲'}</b><span>点击切换 Demo 状态</span></div>`);if(c.dryer)tiles.push(`<div class='status-tile clickable' onclick="cycleDevice('dryer')"><span>♨️ 烘干机</span><b><i class='status-dot ${l.dryer==='running'?'busy':''}'></i>${l.dryer==='running'?'使用中 · 还剩 42 分':'空闲'}</b><span>点击切换 Demo 状态</span></div>`);if(c.balcony)tiles.push(`<div class='status-tile clickable' onclick="cycleDevice('balcony')"><span>👕 阳台晾晒</span><b><i class='status-dot ${l.balcony==='drying'?'busy':''}'></i>${l.balcony==='drying'?'有衣物晾晒':'无衣物'}</b><span>${w.rain&&l.balcony==='drying'?'可能下雨，建议收衣服':'根据天气给出提醒'}</span></div>`);tiles.push(`<div class='status-tile clickable' onclick="cycleDevice('bathroom')"><span>🚿 公共卫生间</span><b><i class='status-dot ${l.bathroom==='busy'?'busy':''}'></i>${l.bathroom==='busy'?'使用中':'空闲'}</b><span>${l.bathroom==='busy'?'建议稍后洗澡 / 如厕':'现在可以使用'}</span></div>`);return `<div class='life-bar'><div class='card clock-card'><div><div class='label' id='todayDate'></div><div class='clock-big' id='clockNow'>--:--</div><div class='facility-note'>Singapore · 梧桐公寓</div></div><div class='weather'><b style='font-size:22px;color:var(--ink)'>${w.temp}°</b><br>${w.text}${w.rain&&c.balcony&&l.balcony==='drying'?`<div class='weather-alert'>☔ 有降雨风险 · 记得收衣服</div>`:''}</div></div><div class='card'><div class='space-head'><h3>家的实时状态</h3><span class='mini'>按家中实际设施显示</span></div><div class='home-status'>${tiles.join('')}</div></div></div>`}

ass='row'><div class='avatar' style='width:36px;height:36px'>${['林','A','M','我'][i]||'·'}</div><div class='grow'><b>${a}</b><span>最近</span></div></div>`).join('')}</div></div>`;updateClock()}

function updateClock(){let d=new Date(),t=$('clockNow'),x=$('todayDate');if(t)t.textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});if(x)x.textContent=d.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'})}

async function loadWeather(){try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=1.3521&longitude=103.8198&current=temperature_2m,weather_code,precipitation&hourly=precipitation_probability&forecast_days=1&timezone=Asia%2FSingapore');let j=await r.json(),code=j.current.weather_code,p=j.current.precipitation||0,prob=Math.max(...(j.hourly.precipitation_probability||[0]));window.homiWeather={temp:Math.round(j.current.temperature_2m),rain:p>0||prob>=50,text:(p>0||prob>=50)?`降雨概率 ${prob}%`:'天气稳定'};renderDashboard()}catch(e){window.homiWeather={temp:'--',rain:false,text:'天气暂不可用'};renderDashboard()}}

function renderSupplies(){let mine=state.supplies.filter(x=>x.claimedBy==='me'&&x.status==='low');$('supplies').innerHTML=`<div class='pagehead'><h2>公共物品</h2><button class='action' onclick="openModal('supply')">＋ 登记物品</button></div><div class='subnav'><button class='active' onclick="document.getElementById('inventory').scrollIntoView({behavior:'smooth'})">全部库存</button><button onclick="document.getElementById('shopping').scrollIntoView({behavior:'smooth'})">我的采购 <span class='badge'>${mine.length}</span></button></div><div class='grid'><div class='card full' id='shopping'><h3>🛒 我的采购清单</h3>${mine.length?mine.map(x=>`<div class='row'><div class='icon'>${x.icon}</div><div class='grow'><b>${esc(x.name)}</b><span>${x.stock} · 已由你认领</span></div><button class='action ghost' onclick='unclaimSupply(${x.id})'>取消认领</button><button class='action' onclick='buySupply(${x.id})'>买到了</button></div>`).join(''):`<div class='empty'>暂无待采购物品。认领低库存物品后会自动出现在这里。</div>`}</div><div class='card full' id='inventory'><h3>全部库存</h3>${state.supplies.map(x=>`<div class='row' id='supply-${x.id}'><div class='icon'>${x.icon}</div><div class='grow'><b>${esc(x.name)}</b><span>${x.stock}${x.claimedBy==='me'?' · 你已认领采购':''}</span></div><span class='pill ${x.status==='low'?'warn':''}'>${x.status==='low'?'快没了':'充足'}</span>${x.status==='low'?`<button class='action ghost' onclick='claimSupply(${x.id})'>${x.claimedBy==='me'?'查看采购清单':'认领采购'}</button>`:''}</div>`).join('')}</div></div>`}

function renderRules(){$('rules').innerHTML=`<div class='pagehead'><h2>室友公约</h2><button class='action' onclick="openModal('rule')">＋ 新增公约</button></div><div class='grid'><div class='card full'>${state.rules.map(x=>`<div class='row'><div class='check'>${x.confirmed===4?'✓':'!'}</div><div class='grow'><b>${esc(x.text)}</b><span>${x.confirmed}/4 位室友已确认</span><div class='progress'><i style='width:${x.confirmed/4*100}%'></i></div></div>${x.confirmed<4?`<button class='action' onclick='confirmRule(${x.id})'>我确认</button>`:''}</div>`).join('')}</div></div>`}function confirmRule(id){state.rules.find(x=>x.id===id).confirmed=4;persist();renderAll();toast('已确认这条室友公约')}
function renderProfile(){let mine=state.supplies.filter(x=>x.claimedBy==='me'&&x.status==='low').length,todo=state.chores.filter(x=>x.owner==='me'&&x.status==='todo').length;$('profile').innerHTML=`<div class='grid'><div class='card full'><div class='house-card'><div style='display:flex;gap:16px;align-items:center'><label class='avatar' id='profileAvatar' style='width:72px;height:72px;cursor:pointer;overflow:hidden'>${avatarData?`<img src='${avatarData}' style='width:100%;height:100%;object-fit:cover'>`:esc(savedName[0])}<input type='file' accept='image/*' hidden onchange='previewAvatar(event)'></label><div><h2 style='margin:0'>${esc(savedName)}</h2><span class='source'>管理员 · 梧桐公寓<br>点击头像可更换</span></div></div></div><div class='field'><label>姓名 / 昵称</label><input id='nameInput' value='${esc(savedName)}'></div><div class='field'><label>语言</label><select id='languageSelect' onchange='changeLanguage(this.value)'><option value='zh' ${savedLang==='zh'?'selected':''}>简体中文</option><option value='en' ${savedLang==='en'?'selected':''}>English</option></select></div><div class='field'><label>家庭设施（没有的设备可关闭）</label><div class='facility-grid'><div class='facility-option'>洗衣机 <input type='checkbox' ${state.homeConfig.washer?'checked':''} onchange="setFacility('washer',this.checked)"></div><div class='facility-option'>烘干机 <input type='checkbox' ${state.homeConfig.dryer?'checked':''} onchange="setFacility('dryer',this.checked)"></div><div class='facility-option'>阳台晾晒 <input type='checkbox' ${state.homeConfig.balcony?'checked':''} onchange="setFacility('balcony',this.checked)"></div></div><div class='facility-note'>首页只展示你家实际拥有的设施；公共卫生间状态默认保留。</div></div><button class='action' onclick='saveProfile()'>保存个人资料</button><div class='profile-home'><div><h3>🌿 梧桐公寓</h3><p>Singapore · 4 位室友 · 一起把生活过清楚</p></div></div></div><div class='card stat clickable' onclick="goPage('bills')"><div class='label'>我的待付款</div><div class='big'>${state.bills.filter(x=>x.status==='unpaid').length} 笔</div></div><div class='card stat clickable' onclick="goPage('chores')"><div class='label'>我的值日</div><div class='big'>${todo} 项</div></div><div class='card stat clickable' onclick="goPage('supplies','shopping')"><div class='label'>我的采购</div><div class='big'>${mine} 项</div></div><div class='card full'><h3>我的室友</h3><div class='row'><div class='avatar'>${esc(savedName[0])}</div><div class='grow'><b>${esc(savedName)}（我）</b><span>管理员</span></div></div>${['小林','Alex','Mia'].map(n=>`<div class='row'><div class='avatar'>${n[0]}</div><div class='grow'><b>${n}</b><span>室友</span></div></div>`).join('')}</div></div>`;updateChrome()}

function previewAvatar(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{avatarData=r.result;localStorage.setItem('homiAvatar',avatarData);renderAll();toast('头像已更新')};r.readAsDataURL(f)}function saveProfile(){savedName=$('nameInput').value.trim()||savedName;localStorage.setItem('homiName',savedName);renderAll();toast('个人资料已保存')}function changeLanguage(v){savedLang=v;localStorage.setItem('homiLang',v);toast(v==='en'?'Language preference saved. Full English copy is in the next localization pass.':'已切换简体中文')}
let modalType='';function openModal(type){modalType=type;let map={expense:['记一笔共同支出','账单名称','例如：9 月水费'],chore:['添加清洁值日','值日任务','例如：清洁冰箱'],supply:['登记公共物品','物品名称','例如：厨房纸'],rule:['新增室友公约','公约内容','例如：工作日不带朋友过夜']},m=map[type];$('modalBody').innerHTML=`<h3>${m[0]}</h3><div class='field'><label>${m[1]}</label><input id='mName' placeholder='${m[2]}'></div>${type==='expense'?`<div class='field'><label>金额</label><input id='mAmount' type='number' placeholder='0.00'></div><div class='field'><label>付款人</label><select id='mPayer'><option>${esc(savedName)}</option><option>小林</option><option>Alex</option><option>Mia</option></select></div>`:''}<div class='buttons'><button class='action ghost' onclick='closeModal()'>取消</button><button class='action' onclick='saveModal()'>保存</button></div>`;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}

// ===== V9: configurable facilities, custom timers, improved weather =====
function migrateV9(){
  if(!Array.isArray(state.facilities)){
    state.facilities=[
      {id:'washer',name:'洗衣机',icon:'🫧',kind:'timed',status:'idle',endAt:null,owner:null},
      {id:'dryer',name:'烘干机',icon:'♨️',kind:'timed',status:'idle',endAt:null,owner:null},
      {id:'balcony',name:'阳台晾晒',icon:'👕',kind:'toggle',status:'active',endAt:null,owner:null},
      {id:'bathroom',name:'公共卫生间',icon:'🚿',kind:'timed',status:'idle',endAt:null,owner:null}
    ];
  }
  // clear expired timers
  state.facilities.forEach(f=>{if(f.endAt && Date.now()>=f.endAt){f.status='idle';f.endAt=null;f.owner=null}});
  persist();
}
migrateV9();
function remainingText(f){if(!f.endAt)return '';let ms=f.endAt-Date.now();if(ms<=0)return '即将结束';let m=Math.ceil(ms/60000);if(m>=60){let h=Math.floor(m/60),mm=m%60;return `${h}小时${mm?mm+'分':''}`}return `${m} 分钟`}
function facilityStatus(f){if(f.kind==='toggle')return f.status==='active'?'有衣物晾晒':'暂无晾晒';return f.status==='busy'?'使用中':'空闲'}
function renderFacilityTile(f){let busy=f.kind==='toggle'?f.status==='active':f.status==='busy';let sub=f.kind==='toggle'?(busy?'衣物正在阳台晾晒':'当前没有衣物'):(busy?`${f.owner||savedName} · 预计 ${new Date(f.endAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})} 空闲`:'现在可以使用');let actions='';if(f.kind==='toggle')actions=`<button class='mini-btn ${busy?'':'primary'}' onclick="event.stopPropagation();toggleFacilityState('${f.id}')">${busy?'已收衣':'开始晾晒'}</button>`;else actions=busy?`<button class='mini-btn' onclick="event.stopPropagation();openTimer('${f.id}')">调整时间</button><button class='mini-btn danger' onclick="event.stopPropagation();finishFacility('${f.id}')">结束使用</button>`:`<button class='mini-btn primary' onclick="event.stopPropagation();openTimer('${f.id}')">开始使用</button>`;return `<div class='status-tile'><div><div class='facility-top'><div class='facility-name'><span class='facility-icon'>${f.icon}</span> ${esc(f.name)}</div><i class='status-dot ${busy?'busy':''}'></i></div><div class='status-line ${busy?'busy':''}'>${facilityStatus(f)}</div>${f.kind==='timed'&&busy?`<div class='timer'>${remainingText(f)}</div>`:''}<div class='facility-note'>${sub}</div></div><div class='facility-actions'>${actions}</div></div>`}
function weatherText(){return window.homiWeather||{temp:'--',desc:'正在获取',prob:'--',rain:false,humidity:'--',wind:'--'}}
function renderLifeBar(){let w=weatherText(),fs=state.facilities||[],bal=fs.find(f=>f.id==='balcony'||f.name.includes('阳台')),drying=bal&&bal.status==='active';let tip=w.rain&&drying?'有降雨风险，建议尽快收衣服':w.rain?'外出建议带伞':drying?'天气较稳定，可继续晾晒':'根据天气安排洗晒';return `<div class='life-bar'><div class='card weather-card'><div class='weather-main'><div class='weather-kicker'><span>📍 Singapore</span><span>·</span><span id='todayDate'></span></div><div class='weather-temp-row'><div class='weather-temp'>${w.temp}°</div><div class='weather-desc'>${w.desc}</div></div><div class='weather-metrics'><div class='metric-chip'>💧 湿度 ${w.humidity}%</div><div class='metric-chip'>💨 风速 ${w.wind} km/h</div><div class='metric-chip'>🕘 <span id='clockNow'>--:--</span></div></div></div><div class='weather-side'><div><div class='rain-number'>${w.prob}%</div><div class='rain-label'>未来 3h 最高降雨概率</div></div><div class='laundry-tip ${w.rain&&drying?'alert':''}'>${w.rain&&drying?'☔':'👕'} ${tip}</div></div></div><div class='card live-card'><div class='space-head'><div><h3>家的实时状态</h3><div class='facility-note'>共享设施状态 · 使用前先看一眼</div></div><button class='mini-btn' onclick="goPage('profile','facilityManage')">管理设施</button></div><div class='home-status'>${fs.map(renderFacilityTile).join('')||`<div class='empty'>还没有添加家庭设施</div>`}</div></div></div>`}
function openTimer(id){let f=state.facilities.find(x=>x.id===id);if(!f)return;$('modalBody').innerHTML=`<h3>${f.status==='busy'?'调整':'开始'}使用 · ${esc(f.name)}</h3><p class='source'>设置预计占用时长，室友会看到剩余时间和预计空闲时间。</p><div class='choice-grid' style='grid-template-columns:repeat(4,1fr);margin:14px 0'><button class='choice' style='padding:12px;text-align:center' onclick="setDurationPreset(15)">15 分</button><button class='choice' style='padding:12px;text-align:center' onclick="setDurationPreset(30)">30 分</button><button class='choice' style='padding:12px;text-align:center' onclick="setDurationPreset(45)">45 分</button><button class='choice' style='padding:12px;text-align:center' onclick="setDurationPreset(60)">60 分</button></div><div class='field'><label>自定义剩余时间（分钟）</label><input id='durationInput' type='number' min='1' max='480' value='${f.endAt?Math.max(1,Math.ceil((f.endAt-Date.now())/60000)):30}'></div><div class='field'><label>使用人</label><input id='facilityOwner' value='${esc(f.owner||savedName)}'></div><div class='buttons'><button class='action ghost' onclick='closeModal()'>取消</button><button class='action' onclick="saveFacilityTimer('${id}')">保存</button></div>`;$('modal').classList.add('show')}
function setDurationPreset(n){let e=$('durationInput');if(e)e.value=n}
function saveFacilityTimer(id){let f=state.facilities.find(x=>x.id===id),mins=Math.max(1,Math.min(480,Number($('durationInput').value)||30));f.status='busy';f.endAt=Date.now()+mins*60000;f.owner=$('facilityOwner').value.trim()||savedName;persist();closeModal();renderAll();toast(`${f.name} 已设置 ${mins} 分钟`)}
function finishFacility(id){let f=state.facilities.find(x=>x.id===id);f.status='idle';f.endAt=null;f.owner=null;persist();renderAll();toast(`${f.name} 已空闲`)}
function toggleFacilityState(id){let f=state.facilities.find(x=>x.id===id);f.status=f.status==='active'?'idle':'active';persist();renderAll();toast(f.status==='active'?`${f.name} 已标记使用中`:`${f.name} 已标记空闲`)}
function openAddFacility(){ $('modalBody').innerHTML=`<h3>添加家庭设施</h3><div class='field'><label>设施名称</label><input id='newFacilityName' placeholder='例如：洗碗机 / 扫地机器人 / 次卫'></div><div class='field'><label>图标</label><select id='newFacilityIcon'><option>🧺</option><option>🍽️</option><option>🤖</option><option>🚿</option><option>🚽</option><option>🅿️</option><option>📦</option></select></div><div class='field'><label>状态类型</label><select id='newFacilityKind'><option value='timed'>计时占用（可设置剩余时间）</option><option value='toggle'>简单状态（使用中 / 空闲）</option></select></div><div class='buttons'><button class='action ghost' onclick='closeModal()'>取消</button><button class='action' onclick='addFacility()'>添加</button></div>`;$('modal').classList.add('show')}
function addFacility(){let name=$('newFacilityName').value.trim();if(!name){toast('请输入设施名称');return}state.facilities.push({id:'f'+Date.now(),name,icon:$('newFacilityIcon').value,kind:$('newFacilityKind').value,status:'idle',endAt:null,owner:null});persist();closeModal();renderAll();toast(`已添加 ${name}`);setTimeout(()=>document.getElementById('facilityManage')?.scrollIntoView({behavior:'smooth'}),50)}
function deleteFacility(id){let f=state.facilities.find(x=>x.id===id);if(!f)return;if(!confirm(`删除“${f.name}”？之后可以重新添加。`))return;state.facilities=state.facilities.filter(x=>x.id!==id);persist();renderAll();toast('设施已删除')}
function renderProfile(){let mine=state.supplies.filter(x=>x.claimedBy==='me'&&x.status==='low').length,todo=state.chores.filter(x=>x.owner==='me'&&x.status==='todo').length;$('profile').innerHTML=`<div class='grid'><div class='card full'><div class='house-card'><div style='display:flex;gap:16px;align-items:center'><label class='avatar' id='profileAvatar' style='width:72px;height:72px;cursor:pointer;overflow:hidden'>${avatarData?`<img src='${avatarData}' style='width:100%;height:100%;object-fit:cover'>`:esc(savedName[0])}<input type='file' accept='image/*' hidden onchange='previewAvatar(event)'></label><div><h2 style='margin:0'>${esc(savedName)}</h2><span class='source'>管理员 · 梧桐公寓<br>点击头像可更换</span></div></div></div><div class='field'><label>姓名 / 昵称</label><input id='nameInput' value='${esc(savedName)}'></div><div class='field'><label>语言</label><select id='languageSelect' onchange='changeLanguage(this.value)'><option value='zh' ${savedLang==='zh'?'selected':''}>简体中文</option><option value='en' ${savedLang==='en'?'selected':''}>English</option></select></div><button class='action' onclick='saveProfile()'>保存个人资料</button></div><div class='card stat clickable' onclick="goPage('bills')"><div class='label'>我的待付款</div><div class='big'>${state.bills.filter(x=>x.status==='unpaid').length} 笔</div></div><div class='card stat clickable' onclick="goPage('chores')"><div class='label'>我的值日</div><div class='big'>${todo} 项</div></div><div class='card stat clickable' onclick="goPage('supplies','shopping')"><div class='label'>我的采购</div><div class='big'>${mine} 项</div></div><div class='card full' id='facilityManage'><div class='manage-head'><div><h3 style='margin:0'>家庭设施</h3><div class='facility-note'>按实际住房配置自由添加或删除；计时设施可自定义剩余时间。</div></div><button class='action' onclick='openAddFacility()'>＋ 添加设施</button></div><div class='facility-manage'>${state.facilities.map(f=>`<div class='manage-item'><div class='facility-icon'>${f.icon}</div><div class='grow'><b>${esc(f.name)}</b><span>${f.kind==='timed'?'计时占用':'简单状态'} · ${facilityStatus(f)}</span></div><button class='mini-btn danger' onclick="deleteFacility('${f.id}')">删除</button></div>`).join('')||`<div class='empty'>暂无设施，点击右上角添加。</div>`}</div></div><div class='card full'><h3>我的室友</h3><div class='row'><div class='avatar'>${esc(savedName[0])}</div><div class='grow'><b>${esc(savedName)}（我）</b><span>管理员</span></div></div>${['小林','Alex','Mia'].map(n=>`<div class='row'><div class='avatar'>${n[0]}</div><div class='grow'><b>${n}</b><span>室友</span></div></div>`).join('')}</div></div>`;updateChrome()}
async function loadWeather(){try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=1.3521&longitude=103.8198&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&hourly=precipitation_probability&forecast_days=1&timezone=Asia%2FSingapore');let j=await r.json(),now=new Date(),times=j.hourly.time.map(x=>new Date(x)),idx=times.findIndex(t=>t>=now);if(idx<0)idx=0;let probs=j.hourly.precipitation_probability.slice(idx,idx+4),prob=Math.max(0,...probs),code=j.current.weather_code;let desc=code===0?'晴朗':code<=3?'多云':code<=48?'有雾':code<=67?'有雨':code<=82?'阵雨':'雷雨';window.homiWeather={temp:Math.round(j.current.temperature_2m),desc,prob,rain:prob>=45,humidity:Math.round(j.current.relative_humidity_2m),wind:Math.round(j.current.wind_speed_10m)};renderDashboard()}catch(e){window.homiWeather={temp:'--',desc:'天气暂不可用',prob:'--',rain:false,humidity:'--',wind:'--'};renderDashboard()}}
setInterval(()=>{let changed=false;(state.facilities||[]).forEach(f=>{if(f.endAt&&Date.now()>=f.endAt){f.status='idle';f.endAt=null;f.owner=null;changed=true}});if(changed)persist();if(document.getElementById('dashboard')?.classList.contains('active'))renderDashboard()},60000);

renderAll();loadWeather();
</script></body></html>
